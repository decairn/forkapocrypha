[package]
name = "apocrypha"
version = "0.1.14"
description = "Modern addon manager for The Elder Scrolls Online"
authors = ["Vitor Danrley"]
edition = "2021"

[lib]
name = "apocrypha_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "gzip"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "fs", "sync"] }
rusqlite = { version = "0.43", features = ["bundled"] }
dirs = "7"
anyhow = "1"
thiserror = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
regex = "1"
once_cell = "1"
zip = { version = "9", default-features = false, features = ["deflate"] }
sysinfo = { version = "0.40", default-features = false, features = ["system"] }
tempfile = "3.27.0"
sha2 = "0.11"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }
