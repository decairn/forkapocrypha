name: release

# Cut a release whenever a vX.Y.Z tag is pushed. The matrix builds MSI on
# Windows and AppImage on Linux, with updater artifacts when a signing key
# is configured, and uploads everything to a draft release for the tag.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.1.2)"
        required: true

jobs:
  publish:
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: "--bundles msi"
          - platform: ubuntu-22.04
            args: "--bundles appimage"

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      - name: Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libgtk-3-dev \
            libssl-dev \
            patchelf

      - name: Install frontend deps
        working-directory: app
        run: npm ci

      - name: Compute release notes
        id: notes
        shell: bash
        run: |
          CURRENT="$RELEASE_TAG"
          PREV=$(git tag --merged "$CURRENT" --list 'v*' --sort=-version:refname |
            awk -v current="$CURRENT" '$0 != current && !previous { previous = $0 } END { print previous }')
          if [ -n "$PREV" ]; then
            CHANGES=$(git log "${PREV}..${CURRENT}" --pretty=format:"- %s" --no-merges)
            COMPARE_URL="https://github.com/${{ github.repository }}/compare/${PREV}...${CURRENT}"
          else
            CHANGES=$(git log "${CURRENT}" --pretty=format:"- %s" --no-merges -10)
            COMPARE_URL="https://github.com/${{ github.repository }}/commits/${CURRENT}"
          fi
          {
            echo 'BODY<<EOF_BODY'
            echo "Apocrypha ${CURRENT} — modern addon manager for The Elder Scrolls Online."
            echo ""
            echo "Highlights"
            echo ""
            echo "${CHANGES}"
            echo ""
            echo "Downloads"
            echo ""
            echo "- Windows: the .msi installer attached below"
            echo "- Linux / Steam Deck: the .AppImage (chmod +x and run)"
            echo ""
            echo "Heads-up for Windows"
            echo ""
            echo "The build is not code-signed yet, so first launch shows the SmartScreen"
            echo 'dialog ("Windows protected your PC"). Click More info > Run anyway once;'
            echo "Windows trusts it from then on."
            echo ""
            echo "Full changelog: ${COMPARE_URL}"
            echo 'EOF_BODY'
          } >> "$GITHUB_OUTPUT"

      - name: Build and upload draft assets
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAURI_SIGNING_PUBLIC_KEY: ${{ vars.TAURI_SIGNING_PUBLIC_KEY }}
        with:
          projectPath: app
          tauriScript: npm run tauri
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: "Apocrypha ${{ env.RELEASE_TAG }}"
          releaseBody: ${{ steps.notes.outputs.BODY }}
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: ${{ vars.TAURI_SIGNING_PUBLIC_KEY != '' }}
          args: ${{ matrix.args }}${{ vars.TAURI_SIGNING_PUBLIC_KEY == '' && ' --config src-tauri/tauri.ci.conf.json' || '' }}
